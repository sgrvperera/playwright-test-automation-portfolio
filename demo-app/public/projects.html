<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects - ProjectHub</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #111827;
      --panel: rgba(255, 255, 255, 0.08);
      --panel-border: rgba(255, 255, 255, 0.14);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --primary: #7c3aed;
      --primary-2: #2563eb;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      --radius: 22px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: Inter, "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(124, 58, 237, 0.25), transparent 30%),
        radial-gradient(circle at top right, rgba(37, 99, 235, 0.2), transparent 26%),
        linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 999px;
      filter: blur(80px);
      pointer-events: none;
      opacity: 0.55;
      z-index: 0;
    }

    body::before {
      width: 280px;
      height: 280px;
      background: rgba(124, 58, 237, 0.32);
      top: -90px;
      left: -80px;
    }

    body::after {
      width: 320px;
      height: 320px;
      background: rgba(37, 99, 235, 0.22);
      bottom: -110px;
      right: -100px;
    }

    .shell {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      padding: 24px;
    }

    .header,
    .nav,
    .toolbar,
    .projects-table,
    .modal-content {
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
    }

    .header {
      max-width: 1280px;
      margin: 0 auto 18px;
      padding: 18px 24px;
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      font-size: 20px;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(124, 58, 237, 0.25);
    }

    .brand-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .header h1 {
      color: #fff;
      font-size: 24px;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .header .subtitle {
      color: var(--muted);
      font-size: 13px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .user-name {
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logout-btn {
      padding: 10px 16px;
      background: linear-gradient(135deg, var(--danger), #dc2626);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 12px 24px rgba(239, 68, 68, 0.22);
      transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.25s ease;
    }

    .logout-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
      box-shadow: 0 14px 28px rgba(239, 68, 68, 0.28);
    }

    .nav {
      max-width: 1280px;
      margin: 0 auto 18px;
      padding: 12px;
      border-radius: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 12px;
      color: #e2e8f0;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      transition: transform 0.2s ease, background 0.25s ease, border-color 0.25s ease;
    }

    .nav a:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 6px 0 24px;
    }

    .page-header {
      margin: 6px 0 18px;
      padding: 0 4px;
    }

    .page-header h2 {
      font-size: 34px;
      line-height: 1.1;
      letter-spacing: -0.04em;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .page-header p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      max-width: 820px;
    }

    .toolbar {
      padding: 18px;
      border-radius: 20px;
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar input,
    .toolbar select,
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      outline: none;
      transition: transform 0.2s ease, border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    .toolbar input::placeholder,
    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: #94a3b8;
    }

    .toolbar input:focus,
    .toolbar select:focus,
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: rgba(124, 58, 237, 0.9);
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.16);
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .toolbar input {
      min-width: 250px;
      flex: 1 1 260px;
    }

    .toolbar select {
      min-width: 170px;
      flex: 0 1 170px;
    }

    .toolbar button,
    .actions button,
    .modal-actions button {
      border: none;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.25s ease;
    }

    .toolbar button {
      padding: 12px 18px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      box-shadow: 0 12px 24px rgba(124, 58, 237, 0.22);
    }

    .toolbar button:hover,
    .actions button:hover,
    .modal-actions button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .projects-table {
      border-radius: 20px;
      overflow: hidden;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    thead th {
      background: rgba(255, 255, 255, 0.06);
      padding: 16px 18px;
      text-align: left;
      font-weight: 700;
      color: #e2e8f0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    tbody td {
      padding: 16px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      color: #e5e7eb;
      font-size: 14px;
      vertical-align: middle;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: capitalize;
      min-width: 82px;
    }

    .badge.active {
      background: rgba(34, 197, 94, 0.14);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.2);
    }

    .badge.planning {
      background: rgba(245, 158, 11, 0.14);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.2);
    }

    .badge.completed {
      background: rgba(37, 99, 235, 0.14);
      color: #93c5fd;
      border: 1px solid rgba(37, 99, 235, 0.2);
    }

    .badge.high {
      background: rgba(239, 68, 68, 0.14);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .badge.medium {
      background: rgba(245, 158, 11, 0.14);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.2);
    }

    .badge.low {
      background: rgba(37, 99, 235, 0.14);
      color: #93c5fd;
      border: 1px solid rgba(37, 99, 235, 0.2);
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .actions button {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      color: white;
      min-width: 72px;
    }

    .edit-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 10px 18px rgba(124, 58, 237, 0.18);
    }

    .delete-btn {
      background: linear-gradient(135deg, var(--danger), #dc2626);
      box-shadow: 0 10px 18px rgba(239, 68, 68, 0.18);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.72);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 20;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 560px;
      border-radius: 24px;
      padding: 28px;
    }

    .modal-content h2 {
      margin-bottom: 18px;
      color: #fff;
      font-size: 26px;
      letter-spacing: -0.03em;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #e2e8f0;
      font-weight: 600;
      font-size: 14px;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 110px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 22px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
    }

    .save-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 12px 24px rgba(124, 58, 237, 0.22);
    }

    .cancel-btn {
      background: linear-gradient(135deg, #475569, #334155);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.22);
    }

    @media (max-width: 980px) {
      .page-header h2 {
        font-size: 28px;
      }
    }

    @media (max-width: 720px) {
      .shell {
        padding: 14px;
      }

      .header,
      .nav,
      .toolbar,
      .projects-table,
      .modal-content {
        border-radius: 18px;
      }

      .header {
        padding: 16px;
      }

      .nav {
        padding: 10px;
      }

      .toolbar {
        padding: 14px;
      }

      .modal-content {
        padding: 22px;
      }

      .modal-actions {
        flex-direction: column;
      }

      .page-header h2 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <div class="brand">
        <div class="brand-mark">P</div>
        <div class="brand-title">
          <h1>ProjectHub</h1>
          <span class="subtitle">Enterprise Project Management</span>
        </div>
      </div>

      <div class="user-info">
        <span class="user-name" data-testid="user-name"></span>
        <button class="logout-btn" data-testid="logout-button">Logout</button>
      </div>
    </div>

    <div class="nav">
      <a href="/dashboard" data-testid="nav-dashboard">Dashboard</a>
      <a href="/projects" data-testid="nav-projects">Projects</a>
    </div>

    <div class="container">
      <div class="page-header">
        <h2>Projects</h2>
        <p>
          Manage your project portfolio with search, filters, and structured project operations in a modern enterprise workspace.
        </p>
      </div>

      <div class="toolbar">
        <input type="text" placeholder="Search projects..." data-testid="search-input" />
        <select data-testid="status-filter">
          <option value="">All Status</option>
          <option value="active">Active</option>
          <option value="planning">Planning</option>
          <option value="completed">Completed</option>
        </select>
        <select data-testid="priority-filter">
          <option value="">All Priority</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <button data-testid="filter-button">Filter</button>
        <button data-testid="create-project-button">Create Project</button>
      </div>

      <div class="projects-table">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Status</th>
                <th>Priority</th>
                <th>Owner</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody data-testid="projects-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  
  <div class="modal" data-testid="project-modal">
    <div class="modal-content">
      <h2 data-testid="modal-title">Create Project</h2>
      <form id="projectForm">
        <div class="form-group">
          <label>Project Name</label>
          <input type="text" data-testid="project-name-input" required />
        </div>
        <div class="form-group">
          <label>Status</label>
          <select data-testid="project-status-input" required>
            <option value="planning">Planning</option>
            <option value="active">Active</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select data-testid="project-priority-input" required>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea data-testid="project-description-input" rows="3" placeholder="Add project details..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="submit" class="save-btn" data-testid="save-project-button">Save</button>
          <button type="button" class="cancel-btn" data-testid="cancel-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>
  
  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    let currentProjectId = null;
    
    if (!token) window.location.href = '/';
    
    document.querySelector('.user-name').textContent = user.name || 'User';
    document.querySelector('.logout-btn').addEventListener('click', () => {
      localStorage.clear();
      window.location.href = '/';
    });
    
    async function loadProjects(filters = {}) {
      const params = new URLSearchParams(filters);
      const response = await fetch(`/api/projects?${params}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await response.json();
      
      const tbody = document.querySelector('[data-testid="projects-table-body"]');
      tbody.innerHTML = data.data.map(p => `
        <tr data-testid="project-row-${p.id}">
          <td>${p.name}</td>
          <td><span class="badge ${p.status}">${p.status}</span></td>
          <td><span class="badge ${p.priority}">${p.priority}</span></td>
          <td>${p.owner}</td>
          <td>${p.createdAt}</td>
          <td class="actions">
            <button class="edit-btn" data-testid="edit-${p.id}" onclick="editProject('${p.id}')">Edit</button>
            <button class="delete-btn" data-testid="delete-${p.id}" onclick="deleteProject('${p.id}')">Delete</button>
          </td>
        </tr>
      `).join('');
    }
    
    document.querySelector('[data-testid="filter-button"]').addEventListener('click', () => {
      const filters = {
        search: document.querySelector('[data-testid="search-input"]').value,
        status: document.querySelector('[data-testid="status-filter"]').value,
        priority: document.querySelector('[data-testid="priority-filter"]').value
      };
      loadProjects(filters);
    });
    
    document.querySelector('[data-testid="create-project-button"]').addEventListener('click', () => {
      currentProjectId = null;
      document.querySelector('[data-testid="modal-title"]').textContent = 'Create Project';
      document.getElementById('projectForm').reset();
      document.querySelector('[data-testid="project-modal"]').classList.add('active');
    });
    
    document.querySelector('[data-testid="cancel-button"]').addEventListener('click', () => {
      document.querySelector('[data-testid="project-modal"]').classList.remove('active');
    });
    
    document.getElementById('projectForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        name: document.querySelector('[data-testid="project-name-input"]').value,
        status: document.querySelector('[data-testid="project-status-input"]').value,
        priority: document.querySelector('[data-testid="project-priority-input"]').value,
        description: document.querySelector('[data-testid="project-description-input"]').value
      };
      
      const url = currentProjectId ? `/api/projects/${currentProjectId}` : '/api/projects';
      const method = currentProjectId ? 'PUT' : 'POST';
      
      await fetch(url, {
        method,
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      document.querySelector('[data-testid="project-modal"]').classList.remove('active');
      loadProjects();
    });
    
    window.editProject = async (id) => {
      currentProjectId = id;
      const response = await fetch(`/api/projects/${id}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await response.json();
      const project = data.data;
      
      document.querySelector('[data-testid="modal-title"]').textContent = 'Edit Project';
      document.querySelector('[data-testid="project-name-input"]').value = project.name;
      document.querySelector('[data-testid="project-status-input"]').value = project.status;
      document.querySelector('[data-testid="project-priority-input"]').value = project.priority;
      document.querySelector('[data-testid="project-description-input"]').value = project.description;
      document.querySelector('[data-testid="project-modal"]').classList.add('active');
    };
    
    window.deleteProject = async (id) => {
      if (confirm('Are you sure you want to delete this project?')) {
        await fetch(`/api/projects/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        loadProjects();
      }
    };
    
    loadProjects();
  </script>
</body>
</html>
